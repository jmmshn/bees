version: 2

builds:
  - main: ./cmd/bs
    binary: bs
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, -buildvcs=true]
    # bs version reads the commit from Go's VCS stamp; -buildvcs=true fails the build without one.
    ldflags: [-s -w]

archives:
  - formats: [binary]

checksum:
  name_template: SHA256SUMS

changelog:
  use: git
  sort: asc
