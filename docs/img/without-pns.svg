<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect width="960" height="430" rx="10" fill="#0d1117"/>
  <!-- left pane -->
  <rect x="16" y="16" width="452" height="340" rx="8" fill="#161b22" stroke="#30363d"/>
  <circle cx="34" cy="32" r="5" fill="#ff5f57"/><circle cx="50" cy="32" r="5" fill="#febc2e"/><circle cx="66" cy="32" r="5" fill="#28c840"/>
  <text x="242" y="36" fill="#8b949e" text-anchor="middle">claude — main checkout</text>
  <text x="32" y="70" fill="#c9d1d9">&gt; split SPEC into tickets and hand</text>
  <text x="32" y="88" fill="#c9d1d9">  peons-2.1 to the other session</text>
  <text x="32" y="118" fill="#d2a8ff">● I can't reach another Claude Code</text>
  <text x="32" y="136" fill="#d2a8ff">  session. Paste this brief into it:</text>
  <rect x="32" y="148" width="420" height="58" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="44" y="170" fill="#7ee787">Implement the ring adapter per SPEC</text>
  <text x="44" y="190" fill="#7ee787">"Claude adapter". Reply when green.</text>
  <text x="32" y="236" fill="#c9d1d9">&gt; (40 min later) is it done?</text>
  <text x="32" y="266" fill="#d2a8ff">● I have no way to check. Ask the</text>
  <text x="32" y="284" fill="#d2a8ff">  other session and paste its answer.</text>
  <text x="32" y="330" fill="#6e7681">idle · waiting on the human</text>
  <!-- right pane -->
  <rect x="492" y="16" width="452" height="340" rx="8" fill="#161b22" stroke="#30363d"/>
  <circle cx="510" cy="32" r="5" fill="#ff5f57"/><circle cx="526" cy="32" r="5" fill="#febc2e"/><circle cx="542" cy="32" r="5" fill="#28c840"/>
  <text x="718" y="36" fill="#8b949e" text-anchor="middle">claude — worktree peons-2-1</text>
  <text x="508" y="70" fill="#c9d1d9">&gt; Implement the ring adapter per</text>
  <text x="508" y="88" fill="#c9d1d9">  SPEC "Claude adapter"…</text>
  <text x="508" y="118" fill="#d2a8ff">● Done. go test ./... is green.</text>
  <text x="508" y="136" fill="#d2a8ff">  Tell whoever sent this.</text>
  <text x="508" y="330" fill="#6e7681">idle · finished 35 min ago, nobody knows</text>
  <!-- human -->
  <path d="M 452 177 C 482 177, 476 79, 504 79" fill="none" stroke="#f0883e" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M 504 79 l -11 -5 l 0 10 z" fill="#f0883e"/>
  <path d="M 504 128 C 470 128, 486 275, 456 275" fill="none" stroke="#f0883e" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M 456 275 l 11 -5 l 0 10 z" fill="#f0883e"/>
  <text x="480" y="384" fill="#f0883e" text-anchor="middle">you: copy, switch window, paste, wait, check, copy back</text>
  <text x="480" y="406" fill="#6e7681" text-anchor="middle" font-size="11">illustration: two plain Claude Code sessions, no pns</text>
</svg>
