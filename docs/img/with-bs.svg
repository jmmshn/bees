<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect width="960" height="470" rx="10" fill="#0d1117"/>
  <!-- queen -->
  <rect x="16" y="16" width="452" height="410" rx="8" fill="#161b22" stroke="#30363d"/>
  <circle cx="34" cy="32" r="5" fill="#ff5f57"/><circle cx="50" cy="32" r="5" fill="#febc2e"/><circle cx="66" cy="32" r="5" fill="#28c840"/>
  <text x="242" y="36" fill="#8b949e" text-anchor="middle">claude --name queen-bees</text>
  <text x="32" y="70" fill="#c9d1d9">&gt; start bees-2.1 and tell me when</text>
  <text x="32" y="88" fill="#c9d1d9">  it's merged</text>
  <text x="32" y="116" fill="#d2a8ff">● Bash(bs spawn bees-2.1)</text>
  <text x="44" y="134" fill="#8b949e">⎿ spawned bees-2-1 for bees-2.1 in workspace w3</text>
  <text x="32" y="160" fill="#d2a8ff">● Bash(bs send bees-2-1 "procStart</text>
  <text x="44" y="178" fill="#d2a8ff">  is a string in the real registry")</text>
  <text x="44" y="196" fill="#8b949e">⎿ sent 001a13e17519857ec0095a4c21</text>
  <text x="44" y="214" fill="#8b949e">  to bees-2-1</text>
  <text x="32" y="240" fill="#6e7681">  … idle; you go do something else …</text>
  <rect x="28" y="258" width="428" height="40" rx="4" fill="#1f2a1f" stroke="#2ea043"/>
  <text x="38" y="276" fill="#7ee787">&gt; [bs] 1 unread (bees-2-1) — run: bs</text>
  <text x="38" y="292" fill="#7ee787">  inbox   (reply with: bs send bees-2-1 "...")</text>
  <text x="32" y="322" fill="#d2a8ff">● Bash(bs inbox)</text>
  <text x="44" y="340" fill="#8b949e">⎿ ── 001a13e1751a… from bees-2-1</text>
  <text x="44" y="358" fill="#c9d1d9">  pong: ring adapter done, go test</text>
  <text x="44" y="376" fill="#c9d1d9">  ./... green</text>
  <text x="32" y="404" fill="#d2a8ff">● bees-2.1 is done and green. Merging.</text>
  <!-- bee -->
  <rect x="492" y="16" width="452" height="410" rx="8" fill="#161b22" stroke="#30363d"/>
  <circle cx="510" cy="32" r="5" fill="#ff5f57"/><circle cx="526" cy="32" r="5" fill="#febc2e"/><circle cx="542" cy="32" r="5" fill="#28c840"/>
  <text x="718" y="36" fill="#8b949e" text-anchor="middle">claude --name bees-2-1 (worktree)</text>
  <text x="508" y="70" fill="#6e7681">  … idle after its first turn …</text>
  <rect x="504" y="88" width="428" height="40" rx="4" fill="#1f2a1f" stroke="#2ea043"/>
  <text x="514" y="106" fill="#7ee787">&gt; [bs] 1 unread (queen-bees) — run: bs</text>
  <text x="514" y="122" fill="#7ee787">  inbox   (reply with: bs send queen-bees "...")</text>
  <text x="508" y="152" fill="#d2a8ff">● Bash(bs inbox)</text>
  <text x="520" y="170" fill="#8b949e">⎿ ── 001a13e17519857e… from queen-bees</text>
  <text x="520" y="188" fill="#c9d1d9">  procStart is a string in the real</text>
  <text x="520" y="206" fill="#c9d1d9">  registry</text>
  <text x="508" y="232" fill="#d2a8ff">● Update(internal/harness/claude/…)</text>
  <text x="508" y="252" fill="#d2a8ff">● Bash(go test ./...)  ⎿ ok</text>
  <text x="508" y="278" fill="#d2a8ff">● Bash(bs send queen-bees "pong: ring</text>
  <text x="520" y="296" fill="#d2a8ff">  adapter done, go test ./... green")</text>
  <text x="520" y="314" fill="#8b949e">⎿ sent 001a13e1751a5ab09814f85ef7</text>
  <text x="520" y="332" fill="#8b949e">  to queen-bees</text>
  <!-- arrows -->
  <path d="M 440 200 C 480 200, 470 108, 504 108" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <path d="M 504 108 l -11 -5 l 0 10 z" fill="#58a6ff"/>
  <path d="M 520 325 C 470 325, 490 278, 456 278" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <path d="M 456 278 l 11 -5 l 0 10 z" fill="#58a6ff"/>
  <text x="480" y="448" fill="#58a6ff" text-anchor="middle">rings arrive as prompts: no one types in either pane</text>
  <text x="480" y="464" fill="#6e7681" text-anchor="middle" font-size="11">illustration; bs output lines and the doorbell text are verbatim from v0</text>
</svg>
